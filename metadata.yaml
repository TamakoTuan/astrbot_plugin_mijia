name: astrbot_plugin_mijia
display_name: 米家智能家居
short_desc: 在聊天里用一句话控制你家的米家设备
desc: |
  通过米家云 API 在 QQ 等聊天平台查询与控制米家智能家居设备。

  支持扫码登录、设备列表与状态查询、开关控制、属性设置（亮度/色温/温度/模式）、
  设备动作和手动场景，同时注册了自然语言工具，可以直接说「把客厅灯调暗一点」。
  默认仅管理员私聊可用，高危设备需要二次确认。
version: v1.0.0
author: TamakoTz
repo: https://github.com/TamakoTuan/astrbot_plugin_mijia
astrbot_version: ">=4.10.0"
support_platforms:
  - aiocqhttp
  - qq_official
  - telegram
  - lark
  - discord
  - kook
  - weixin_oc
tags:
  - 米家
  - 智能家居
  - 小米
  - IoT
  - 家居控制
